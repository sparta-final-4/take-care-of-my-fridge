name: OpenAPI drift

# 백엔드를 실제로 띄워 스펙과 생성 클라이언트를 다시 만들고, 커밋된 것과 다르면 실패한다.
# 경고용 체크다(브랜치 룰셋의 필수 체크로 지정하지 않는다). 실패하면 "oag:generate를
# 최신 백엔드로 제대로 돌렸는지" 확인하라는 뜻이며, 머지 여부는 작성자와 리뷰어가 판단한다.
on:
  pull_request:
    paths:
      - 'take-care-of-my-fridge-be/**'
      - 'take-care-of-my-fridge-fe/openapi/**'
      - 'take-care-of-my-fridge-fe/src/common/api/generated/**'
      - 'take-care-of-my-fridge-fe/scripts/oag-generate.sh'
      - 'take-care-of-my-fridge-fe/openapitools.json'
      - '.github/workflows/openapi-drift.yml'

concurrency:
  group: openapi-drift-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  drift:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # application.yml의 datasource 설정과 같은 값
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: fridge_db
          MYSQL_USER: fridge_user
          MYSQL_PASSWORD: '12345678'
          MYSQL_ROOT_PASSWORD: '12345678'
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - uses: actions/checkout@v7

      # 백엔드 실행과 openapi-generator-cli(jar) 모두 Java가 필요하다.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v6

      - name: Start backend
        working-directory: take-care-of-my-fridge-be
        run: |
          chmod +x gradlew
          JWT_SECRET="$(openssl rand -base64 48)" nohup ./gradlew bootRun --no-daemon > "$RUNNER_TEMP/backend.log" 2>&1 &

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: take-care-of-my-fridge-fe/package.json

      - uses: actions/setup-node@v5
        with:
          node-version-file: take-care-of-my-fridge-fe/.node-version
          cache: pnpm
          cache-dependency-path: take-care-of-my-fridge-fe/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: take-care-of-my-fridge-fe
        run: pnpm install --frozen-lockfile

      - name: Wait for backend
        run: |
          for i in $(seq 1 90); do
            if curl -sf -o /dev/null http://localhost:8080/v3/api-docs; then
              echo "Backend is up."
              exit 0
            fi
            sleep 2
          done
          echo "Backend did not start in time."
          cat "$RUNNER_TEMP/backend.log"
          exit 1

      - name: Regenerate spec and client
        working-directory: take-care-of-my-fridge-fe
        env:
          OPENAPI_SPEC_URL: http://localhost:8080/v3/api-docs
        run: pnpm oag:generate

      - name: Check for drift
        run: |
          paths="take-care-of-my-fridge-fe/openapi take-care-of-my-fridge-fe/src/common/api/generated"
          if [ -n "$(git status --porcelain -- $paths)" ]; then
            git status --short -- $paths
            git --no-pager diff --stat -- $paths
            echo "::error::스펙 또는 생성 클라이언트가 백엔드와 다릅니다. oag를 최신 백엔드로 돌렸는지 확인하세요: 최신 dev 머지 → 백엔드 실행 → take-care-of-my-fridge-fe에서 'pnpm oag:generate' → openapi/와 src/common/api/generated/ 커밋."
            exit 1
          fi
          echo "No drift."

      - name: Backend log
        if: failure()
        run: tail -n 200 "$RUNNER_TEMP/backend.log" || true

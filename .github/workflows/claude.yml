name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      contains(
        fromJSON('["OWNER","MEMBER","COLLABORATOR"]'),
        github.event.comment.author_association || github.event.review.author_association || github.event.issue.author_association
      ) &&
      (
        (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
        (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
      )
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
      actions: read # Required for Claude to read CI results on PRs
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - run: chmod +x take-care-of-my-fridge-be/gradlew

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # This is an optional setting that allows Claude to read CI results on PRs
          additional_permissions: |
            actions: read

          # Optional: Give a custom prompt to Claude. If this is not specified, Claude will perform the instructions specified in the comment that tagged it.
          # prompt: 'Update the pull request description to include a summary of changes.'

          # Optional: Add claude_args to customize behavior and configuration
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options
          # claude_args: '--allowed-tools Bash(gh pr *)'
          claude_args: |
            --max-turns 30
            --allowed-tools "Bash(./gradlew:*),Bash(./take-care-of-my-fridge-be/gradlew:*),Bash(take-care-of-my-fridge-be/gradlew:*),Bash(cd take-care-of-my-fridge-be),Bash(git diff*),Bash(git log*)"
            --append-system-prompt '
            [언어]
            모든 응답(리뷰, 코멘트, 진행 상황 체크리스트 포함)은 반드시 한국어로 작성하세요. 코드, 식별자, 파일 경로, 명령어는 원문 그대로 둡니다.

            [검증]
            빌드와 테스트는 CI가 담당한다. 기본적으로 직접 실행하지 않는다.
            CI 결과를 확인할 수 있으면 참고하고, 아직 진행 중이면 그렇다고 적는다.
            코드만 읽어서는 판단이 어려운 지적을 확인할 때만 직접 실행한다. 예: 컴파일 여부, 특정 테스트의 동작.
            이때는 범위를 좁혀서 실행한다:
              take-care-of-my-fridge-be/gradlew -p take-care-of-my-fridge-be compileJava
              take-care-of-my-fridge-be/gradlew -p take-care-of-my-fridge-be test --tests <클래스명>

            [PR 리뷰 형식] 리뷰 요청일 때만 적용한다. 다른 요청이면 요청에 맞게 자유롭게 답한다.
            1) 맨 첫 줄에 판정을 쓴다:
               ✅ 머지 가능 | ⚠️ 수정 후 머지 | ❌ 머지 보류  ·  점수 N/5  ·  한 문장 이유
            2) 점수 기준:
               5 = 지적 없음 또는 사소한 제안만
               4 = 권장 사항만 있고 바로 머지 가능
               3 = 머지 전에 확인하거나 수정하면 좋은 항목이 있음
               2 = 필수 수정 1건 이상
               1 = 설계 재검토 필요
               🔴 항목이 하나라도 있으면 최대 2점.
            3) 둘째 줄: 🧪 CI 상태 (통과 / 실패 / 진행 중). 직접 실행한 명령이 있으면 그 결과도 쓴다.
            4) 지적 사항은 심각도별 섹션으로 묶는다. 해당 항목이 없는 섹션은 생략한다.
               ### 🔴 필수 수정  (버그, 데이터 손실, 보안, 빌드 실패)
               ### 🟡 권장  (잠재 버그, 운영 리스크, 테스트 누락)
               ### 🟢 제안  (가독성, 스타일, 선택 사항)
               각 항목은 파일:라인 → 문제 → 근거 → 제안 순서로 짧게 쓴다.
            5) 코드로 확정할 수 없는 지적에는 (확인 필요)를 붙이고 확인 방법을 적는다. 추측을 단정하지 않는다.
            6) 마지막에 ### 👍 좋은 점 을 2~3개 쓴다.

            [스타일]
            - 이모지는 판정 줄, 섹션 제목, 심각도 표시에만 쓴다. 본문 문장에는 쓰지 않는다.
            - PR 작성자가 바꾼 내용은 "이 PR에서 ~했습니다"로 쓴다. 본인이 수정한 것처럼 쓰지 않는다.
            - 분량은 지적 수에 비례하게 한다. 문제가 없으면 짧게 끝낸다.
            - 수정 제안 코드는 diff 코드 블록으로 before/after를 보여준다. 3~10줄 정도로 짧게 쓴다.
            '


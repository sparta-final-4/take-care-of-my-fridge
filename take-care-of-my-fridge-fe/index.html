<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>냉장고를 부탁해</title>
    <meta
      name="description"
      content="남은 재료를 적어 두면 소비기한을 챙기고, 그 재료로 만들 요리를 찾아 드려요."
    />
    <meta name="theme-color" content="#f5f1ea" />
    <!-- 링크를 공유할 때 보이는 미리보기. og:image는 배포 주소가 정해지면 절대 주소로 바꾼다. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="냉장고를 부탁해" />
    <meta property="og:title" content="냉장고를 부탁해" />
    <meta
      property="og:description"
      content="남은 재료를 적어 두면 소비기한을 챙기고, 그 재료로 만들 요리를 찾아 드려요."
    />
    <meta property="og:image" content="/photos/main/hero-fridge-960.jpg" />
    <style>
      /* 스크립트를 받는 동안 흰 화면 대신 보이는 로딩. React가 그리면 #root 내용과 함께 사라진다. */
      .boot-loading {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        background: #f5f1ea; /* src/app/theme.ts의 colorBgLayout(PAPER)과 같은 값. 바꾸면 함께 바꾼다 */
      }
      .boot-loading img {
        width: 40px;
        height: 40px;
        opacity: 0;
        /* 금방 뜨는 경우 깜빡이지 않게 잠시 뒤에 나타나 천천히 숨 쉬듯 움직인다. */
        animation: boot-breathe 1.6s ease-in-out 0.3s infinite;
      }
      @keyframes boot-breathe {
        0%,
        100% {
          opacity: 0.35;
          transform: scale(0.94);
        }
        50% {
          opacity: 1;
          transform: scale(1);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot-loading img {
          animation: none;
          opacity: 1;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot-loading" role="status" aria-label="불러오는 중">
        <img src="/favicon.svg" alt="" />
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

  - { id: R09, group: 추천, message: "빨리 먹을 수 있는 거 추천해줘", expect: { intent: RECOMMEND, maxMinutes: 30 } }
  - { id: R10, group: 추천, message: "간단한 한 끼 추천해줘", expect: { intent: RECOMMEND, categories: [밥, 면류, 볶음] } }

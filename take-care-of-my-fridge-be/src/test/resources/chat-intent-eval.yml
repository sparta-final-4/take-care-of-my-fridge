# AI 상담 의도 판단 평가 세트 (ChatIntentEvalManualTest가 읽는다).
# 프롬프트를 바꾸기 전·후로 같은 문장을 실제 AI로 돌려, 서버 안전망을 거친 최종 결과가 기대와 맞는지 본다.
#
# expect에 적은 칸만 비교한다 (안 적은 칸은 보지 않는다).
#   intent          의도 하나 또는 목록(그중 하나면 맞음). 단어 차단에 걸리면 SELF_HARM(자해)·BLOCKED(금지어·탈취)로 본다
#   wanted / avoid  원하는 맛·피할 맛 (순서 상관없이 같은 집합)
#   categories      분류 (같은 집합)
#   keywordsFirst   첫 키워드
#   keywordsAny     키워드 중 하나라도 이 목록에 있으면 맞음
#   keywordsEmpty   true면 키워드가 없어야 함
#   dish            요리 이름(keywordText) / dishEmpty: true면 없어야 함
#   preference      원한 표현(preferenceText)에 이 글이 들어 있어야 함 / preferenceEmpty: true면 없어야 함
#   maxMinutes      분 수, none이면 시간 조건 없음
#   include / exclude  넣을·뺄 재료 이름 (아래 ingredients 사전으로 ID를 이름으로 바꿔 같은 집합인지 본다)
#   useSelectedOnly 재료 꼭 쓰기
#   scope           냉장고 보기 범위 (ALL / MEALKIT / IMMINENT / SEASONING)
#   names           냉장고 보기·사기에서 찾을 이름 (같은 집합)
#   saleOnly        할인 상품만
#   productType     할인 상품 종류 (MEALKIT / INGREDIENT / ALL = 둘 다)
#   target          레시피 자세히 대상 레시피 ID / question: HOW_TO·TIME·INGREDIENTS·TIP·OTHER

# 재료 사전 (IngredientMatcher 대신). 여기 없는 이름은 직접 입력(ING_CUSTOM)으로 본다
ingredients:
  두부: 21
  버섯: 161
  오이: 15
  땅콩: 30
  당근: 40
  대파: 41
  우유: 42
  양파: 43
  브로콜리: 44
  돼지고기: 45
  간장: 46

# 레시피 이름 (이름만 말하기·음식 말 찾기의 레시피 이름 검색 대신, 이름에 말이 들어 있으면 찾음)
recipes:
  - 김치찌개
  - 부대찌개
  - 순두부찌개
  - 된장찌개
  - 마라탕
  - 탕수육
  - 깐풍기
  - 김피탕
  - 두부조림
  - 버섯전
  - 냉면
  - 막국수

# 레시피 분류 (dev /api/recipes/classifications, 2026-11-09). 양념·음료·기타는 서버가 AI 목록에서 뺀다
categories: [과자, 구이, 국, 그라탕, 기타, 김치, 디저트, 떡, 만두, 말이, 면류, 무침, 밥, 볶음, 빵, 샌드위치, 샐러드, 수프, 스튜, 쌈, 양념, 음료, 전, 전골, 절임, 조림, 죽, 찌개, 찜, 튀김, 피자, 한과, 회]

# 이어지는 말 맥락: 직전 추천 카드(ID, 이름)와 직전 조건
contexts:
  jjigae:
    cards: [[101, 김치찌개], [102, 부대찌개], [103, 순두부찌개]]
    condition: { wanted: [SPICY], categories: [찌개], maxMinutes: 30, keywords: [김치찌개] }
  single:
    cards: [[401, 된장찌개]]
    condition: { categories: [찌개] }
  dessert:
    cards: [[201, 티라미수], [202, 약과], [203, 호떡]]
    condition: { categories: [디저트] }
  kimpi:
    cards: [[301, 탕수육], [302, 깐풍기], [303, 돼지고기 찹쌀부침]]
    condition: { categories: [튀김], keywords: [김피탕, 탕수육, 깐풍기], dish: 김피탕 }
  salty:
    cards: [[501, 두부조림], [502, 장조림], [503, 간장불고기]]
    condition: { wanted: [SALTY], categories: [조림] }

cases:

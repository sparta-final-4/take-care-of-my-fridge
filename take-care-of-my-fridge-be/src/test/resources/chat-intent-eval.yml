  - { id: R02, group: 추천, message: "뭐 먹지?", expect: { intent: RECOMMEND, categories: [], keywordsEmpty: true, wanted: [], maxMinutes: none, preferenceEmpty: true } }
  - { id: R03, group: 추천, message: "저녁 뭐 해 먹을까", expect: { intent: RECOMMEND, categories: [], keywordsEmpty: true } }
  - { id: R04, group: 추천, message: "차가운 요리 추천해줘", expect: { intent: RECOMMEND, keywordsAny: [샐러드, 냉채, 냉국, 무침, 냉파스타, 냉면], preference: 차가운, dishEmpty: true } }
  - { id: R05, group: 추천, message: "차가운 면", expect: { intent: RECOMMEND, categories: [면류], keywordsAny: [냉면, 막국수, 콩국수, 냉메밀] } }
  - { id: R06, group: 추천, message: "김피탕 같은 요리 추천해줘", expect: { intent: RECOMMEND, categories: [튀김], keywordsFirst: 김피탕, keywordsAny: [탕수육, 깐풍기], dish: 김피탕 } }
  - { id: R07, group: 추천, message: "따뜻한 국물 요리", expect: { intent: RECOMMEND, categories: [국, 찌개, 전골, 수프, 스튜], keywordsEmpty: true } }

spring:
  application:
    name: take-care-of-my-fridge-be

  datasource:
    url: jdbc:mysql://localhost:3306/fridge_db?useSSL=false&serverTimezone=Asia/Seoul&allowPublicKeyRetrieval=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: fridge_user
    password: '12345678'

  jpa:
    hibernate:
      ddl-auto: update # 또는 create
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  # Parameter Store 연동(spring-cloud-aws)이 기동 시 SSM 클라이언트를 만들 때 리전이 필요하다.
  # 리전이 없으면 AWS 설정이 없는 CI·로컬에서 컨텍스트 로딩이 실패한다. 실제 조회는 prod 프로파일에서만 한다.
  cloud:
    aws:
      region:
        static: ap-northeast-2

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      timeout: 3000ms
      connect-timeout: 2000ms

  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

app:
  auth:
    jwt-secret: WavSy2onX+rGXL9EhdkwDNgkscczEziOL09OsXSj7jEy0XurFwGtpB36WShSTM3t
    cookie-secure: ${AUTH_COOKIE_SECURE:true}
    
# 결제
portone:
  base-url: "https://api.portone.io"
  api-secret: ${PORTONE_API_SECRET}
  store-id: ${PORTONE_STORE_ID}
  channel-key: ${PORTONE_CHANNEL_KEY}
  webhook-secret: ${PORTONE_WEBHOOK_SECRET}

springdoc:
  writer-with-order-by-keys: true

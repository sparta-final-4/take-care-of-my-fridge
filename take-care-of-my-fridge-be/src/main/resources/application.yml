spring:
  application:
    name: take-care-of-my-fridge-be

  datasource:
    url: jdbc:mysql://localhost:3306/fridge_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: fridge_user
    password: '12345678'

  jpa:
    hibernate:
      ddl-auto: update # 또는 create
    show-sql: true
    properties:
      hibernate:
        format_sql: true

app:
  auth:
    jwt-secret: ${JWT_SECRET}
    cookie-secure: ${AUTH_COOKIE_SECURE:true}

spring:
  application:
    name: take-care-of-my-fridge-be

  mvc:
    async:
      request-timeout: 120s

  datasource:
    url: jdbc:mysql://localhost:3306/fridge_db?useSSL=false&serverTimezone=Asia/Seoul&allowPublicKeyRetrieval=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: fridge_user
    password: '12345678'

  jpa:
    hibernate:
      ddl-auto: update # 또는 create
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  # Parameter Store 연동(spring-cloud-aws)이 기동 시 SSM 클라이언트를 만들 때 리전이 필요하다.
  # 리전이 없으면 AWS 설정이 없는 CI·로컬에서 컨텍스트 로딩이 실패한다. 실제 조회는 prod 프로파일에서만 한다.
  cloud:
    aws:
      region:
        static: ap-northeast-2

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      timeout: 3000ms
      connect-timeout: 2000ms

  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

  ai:
    openai:
      api-key: ${OPENAI_API_KEY}
      chat:
        options:
          model: gpt-4o-mini
          temperature: 0.3
      embedding:
        model: text-embedding-3-small
        dimensions: 1536
        # 검색 요청 안에서 불리므로 짧게 둔다. 실패하면 벡터 폴백만 0건이 된다
        timeout: 3s
        max-retries: 0
      timeout: 60s
      max-retries: 1

  elasticsearch:
    uris: ${ELASTICSEARCH_URL:http://localhost:9200}
    connection-timeout: 2s
    socket-timeout: 5s

app:
  auth:
    jwt-secret: WavSy2onX+rGXL9EhdkwDNgkscczEziOL09OsXSj7jEy0XurFwGtpB36WShSTM3t
    cookie-secure: ${AUTH_COOKIE_SECURE:true}
  # 상품 이미지 업로드(S3 Presigned PUT). bucket 이 비어 있으면(로컬) 업로드 API 가 IMAGE_001 을 돌려준다.
  image:
    bucket: ${IMAGE_BUCKET:}
    key-prefix: ${IMAGE_KEY_PREFIX:local}
    public-base-url: ${IMAGE_PUBLIC_BASE_URL:}
  # 서버 → 브라우저 SSE 연결. 연결 유지 시간, 하트비트 주기, 회원당 동시 연결 한도
  sse:
    timeout: 30m
    heartbeat-interval: 30s
    max-connections-per-member: 5
  # 냉장고 재료명 → 표준 재료 매칭 (IngredientMatcher)
  ingredient:
    # 재료 후보 1등 점수가 이 값 이상이면 채택 (1.0 = 이름·별칭 정확 일치)
    exact-match-score: 1.0
    # 끝부분 규칙("서울우유" → 우유)에 쓸 후보 이름 최소 글자 수. 한 글자("파", "무")는 뺀다
    suffix-min-length: 2
  chat:
    # 상담 답 생성기. stub(가짜 답, OpenAI 키 불필요) | openai(실제 AI 스트리밍). 배포 서버는 application-prod.yml에서 openai
    reply-generator: ${CHAT_REPLY_GENERATOR:stub}
    daily-limit: 30
    session-timeout: 30m
    # 한 상담에 답을 동시에 하나만 받도록 거는 잠금의 유지 시간. 요청 타임아웃(120s)보다 길게 둔다.
    # 상담 AI 호출은 30s 타임아웃·재시도 1번이라 최악이어도 약 61초에 끝난다(ChatClientConfig)
    reply-lock-ttl: 150s
    # AI 상담 레시피 후보 검색
    candidate:
      # 후보에서 뺄 레시피 분류(recipes.category 값)
      excluded-categories: 양념, 음료
      # 보유 비율(가진 재료 / 기본 양념 뺀 재료)이 이 값 미만이면 뒤로 보낸다. 0이면 기준 없음
      min-owned-ratio: 0.4
      # 이 재료가 들어 있으면 "확실히 매운" 레시피(맛 데이터 보완). 재료 사전 이름·레시피에 적힌 이름 모두, 공백 빼고 이름에 들어 있으면 해당.
      # 원하는 맛 매운맛("매운 걸로")은 이 기준만 센다. 그냥 "고추"는 넣지 않는다(풋고추·꽈리고추·고명이 많음). 김치류는 넣는다
      spicy-ingredients: 청양고추, 고춧가루, 고추장, 고추기름, 건고추, 베트남고추, 페퍼론치노, 핫소스, 김치, 배추김치, 깍두기, 열무김치, 총각김치, 파김치, 갓김치
      # 이 재료가 들어 있으면 "매울 수 있는" 레시피(조금 들어가는 경우가 많음). 피할 맛 매운맛("매운 거 말고")은 이것까지 뺀다
      mild-spicy-ingredients: 홍고추, 청고추
      # 공백 빼고 이름이 이것과 똑같을 때만 "매울 수 있는" 레시피 (이름에 들어 있는 것으로 보면 오이고추·꽈리고추·아삭이고추까지 걸림)
      mild-spicy-exact-ingredients: 고추, 붉은고추, 고추냉이
      # 이름에 매운 재료(김치 등)가 들어 있어도 이 이름이면 매운 재료로 보지 않는다 (안 매운 김치)
      spicy-exclusions: 백김치, 물김치, 동치미, 나박김치
    # 서로 반대인 맛. 다시 추천에서 이번 말에 원한 맛과 반대인 맛은 원하는 맛에서 지운다 (단맛·감칠맛은 반대 없음, 반대가 아닌 맛은 쌓는다)
    taste-opposites:
      pairs:
        - [MILD, SPICY]
        - [MILD, SALTY]
    # 메시지의 맛 단어로 AI가 뽑은 원하는 맛·피할 맛을 한 번 더 확인한다 (공백 빼고 비교)
    taste-words:
      spicy: 매운, 맵게, 맵지, 매콤, 얼큰, 칼칼
      sweet: 달달, 달게, 단거, 단걸, 단것, 달콤, 단맛
      # 맛 단어 바로 앞에 오면 피함 ("안 맵게", "덜 달게")
      negation-before: 안, 덜
      # 맛 단어 뒤 4글자 안에 오면 피함 ("매운 거 말고", "맵지 않게", "단 거 싫어", "매운 거 못 먹어")
      negation-after: 말고, 빼고, 않, 싫, 없이, 못먹
      # 새 추천에서 이번 말에 그 맛을 말했는지만 본다 (말하지 않은 맛은 원하는·피할 맛에서 뺀다)
      salty: 짠, 짭짤, 짜게, 짭조름
      umami: 감칠, 고소
      mild: 순한, 담백, 슴슴, 심심, 자극적이지
    # 분류 이름과 다른 흔한 말을 분류 묶음으로 본다 (추천·다시 추천의 분류 단어 보정). 분류는 실제 레시피 분류 이름만
    # "국수"는 묶음 말이 아니다 (국으로 보지 않는다)
    category-words:
      groups:
        - word: 국물
          categories: 국, 찌개, 전골, 수프, 스튜
        - word: 면
          categories: 면류
        - word: 반찬
          categories: 무침, 조림, 볶음, 김치, 절임
        - word: 후식
          categories: 디저트
        - word: 간식
          categories: 디저트, 과자, 빵, 떡
        - word: 안주
          categories: 구이, 전, 튀김
        - word: 술안주
          categories: 구이, 전, 튀김
    # 서버가 AI 의도를 추천으로 바꿀 때 본다: 달라는 말이 있고 묻는 말이 없을 때만 바꾼다 (공백 빼고 비교)
    ask-words:
      # "추천 기준이 뭐야?"처럼 달라는 말과 같이 있으면 묻는 말이 이긴다
      # 지난 일을 묻는 말("밥 먹었어?")도 묻는 말이다
      question: 기준, 어떻게, 왜, 방법, 얼마나, 보관, 가격, 차이, 뭐가달라, 뭐가다른, 먹었어, 먹었니, 먹었냐, 했어, 했니
      request: 추천, 뭐있, 보여줘, 먹고싶, 사고싶, 골라줘
      # "밀키트"와 같이 있을 때만 달라는 말로 본다 ("국물 밀키트 있어?")
      mealkit-request: 있어, 있나, 있을까, 없어, 뭐가좋아, 살만한
      # 인사 말이 있으면 이름만 말한 짧은 말이어도 추천으로 바꾸지 않는다 ("안녕 밥은?")
      greeting: 안녕, 반가워, 반갑, 고마워, 고맙, 감사, 잘지내, 잘자, 좋은아침
    # AI를 부르기 전에 거르는 단어 (SafetyWordChecker). 소문자로 바꾸고 공백·숫자·기호를 뺀 글로 비교한다 ("시1발" → "시발")
    # 걸리면 AI 없이 안내 답을 보내고 하루 횟수를 세지 않는다. 걸린 말과 안내 답은 표시(filtered)해 저장하고 문맥·내역 미리보기에서 뺀다
    safety-words:
      # 욕설·불법·위험한 말
      banned: 씨발, 시발, 씨바, ㅅㅂ, ㅆㅂ, 개새끼, 개새기, 병신, ㅂㅅ, 좆, 존나, ㅈㄴ, 미친놈, 미친년, 닥쳐, 폭탄, 마약, 필로폰, 대마초, 살인, 사람죽이, 독극물, 독약, 총기, 해킹
      # 자해·자살을 말하는 말. 금지어보다 먼저 보고 상담 전화 안내를 보낸다
      self-harm: 죽고싶, 죽어버리고싶, 자살, 자해, 극단적선택, 목숨을끊, 살기싫, 사라지고싶, 손목긋, 뛰어내리고싶
      # 지시를 무시하라거나 프롬프트를 공개하라는 말. "너는 이제부터 ~야"처럼 역할만 정하는 말은 넣지 않는다
      injection: 지시무시, 지시를무시, 지시는무시, 지시사항무시, 명령무시, 명령을무시, 시스템프롬프트, 프롬프트보여, 프롬프트를보여, 프롬프트알려, 프롬프트를알려, 프롬프트공개, 프롬프트를공개, 프롬프트출력, 지시보여, 지시를보여, 지시알려, 지시를알려, ignoreprevious, ignoreallprevious, ignoretheabove, ignoreyourinstructions, systemprompt, developermode, 개발자모드, jailbreak, 탈옥
      # 걸리는 말이 들어 있어도 음식 이름 등이라 먼저 지우고 보는 말 ("죽 먹고", "마약김밥", "폭탄주")
      exclusions: 죽먹고, 마약김밥, 마약계란장, 마약계란, 마약달걀, 마약떡볶이, 마약옥수수, 마약소스, 마약토스트, 폭탄주, 폭탄계란찜, 폭탄달걀찜, 폭탄주먹밥, 칼국수, 독일, 약불, 약간
    # 건강 관련 말 (HealthWordChecker, 공백 빼고 비교). 사용자가 보낸 말에 있으면 답 끝에 상담 안내를 붙인다 (막지 않고 하루 횟수도 센다)
    # "약"·"신장"은 짧게 넣지 않는다 ("약 10분", "신장 170cm"). 다이어트는 생활 요청이라 넣지 않는다
    health-words:
      health: 당뇨, 혈당, 고혈압, 혈압, 고지혈, 콜레스테롤, 신장질환, 신장병, 신장기능, 콩팥, 투석, 통풍, 요산, 질환, 환자, 위염, 역류성, 항암, 알레르기, 알러지, 아토피, 임신, 임산부, 산모, 수유, 모유, 복용, 처방, 약먹, 약을먹, 약드시
      # 건강 말이 들어 있어도 요리 말 등이라 먼저 지우고 보는 말
      exclusions: 약불, 약간, 약한불, 신장개업, 수유역
    # 알레르기·못 먹는 재료 (AllergyWordChecker·AllergyExclusionFinder). "○○ 알레르기", "○○ 못 먹어", "○○ 먹으면 안 돼"의 ○○을 추천에서 뺀다
    # ○○은 묶음 말(allergy-groups)이거나 재료 사전에 이름이 그대로 있을 때만 쓰고, 이름에 ○○이 들어 있는 재료로 넓힌다 (땅콩 → 땅콩버터)
    allergy-words:
      # ○○ 뒤에 오는 말 (글자 사이 공백 무시)
      markers: 알레르기, 알러지, 못먹, 먹으면안
      # ○○ 끝에서 떼어 보는 조사 ("새우를" → "새우"). 붙은 이름("오이")을 먼저 본다
      particles: 에는, 에도, 은, 는, 이, 가, 을, 를, 에, 도
      # 재료마다 넓히지 않을 이름 (그 재료를 넓힐 때만 본다). 두 글자 이상은 이름에 들어 있는 재료, 한 글자는 그 글자로 시작하는 재료로 넓히는데,
      # 그중 같은 계열이 아닌 것 (dev 재료 사전 2026-11-07 기준. 한 글자 재료 중 게·귤·쌀·잣·콩·톳·팥은 시작하는 재료가 모두 같은 계열)
      not-same-kind:
        - word: 땅콩
          names: 땅콩호박
        - word: 게
          names: 바게트, 스파게티, 멍게살
        - word: 게살
          names: 멍게살
        # 우유·버터 대신 쓰는 재료 (우유 알레르기에 오히려 쓰고, 땅콩버터의 땅콩은 땅콩 쪽에서 뺀다)
        - word: 우유
          names: 아몬드우유
        - word: 버터
          names: 땅콩버터
        - word: 굴
          names: 굴비
        - word: 김
          names: 김장김치, 김치, 김칫국물, 김칫잎
        - word: 떡
          names: 떡볶이양념파우더
        - word: 마
          names: 마늘, 마늘가루, 마늘기름, 마늘종, 마늘즙, 마늘칩, 마늘튀김, 마른오징어, 마스카포네치즈, 마요네즈, 마카다미아
        - word: 무
          names: 무가당 두유, 무가당 아보카도 마요네즈, 무가당 코코아 파우더, 무가당 코코아가루, 무염버터, 무지개고추, 무화과
        - word: 묵
          names: 묵은지
        - word: 물
          names: 물김치국물, 물밤, 물엿, 물전분, 물파래
        - word: 밤
          names: 밤고구마
        - word: 배
          names: 배추, 배추김치
        - word: 쑥
          names: 쑥갓
        - word: 양
          names: 양겨자, 양념간장, 양념장, 양념족발, 양배추, 양상추, 양송이버섯, 양송이버섯 밑동, 양장피 면, 양파, 양파 껍질, 양파가루, 양파즙
        - word: 조
          names: 조개, 조개살, 조기, 조랭이떡, 조림간장, 조미료, 조선부추, 조청
    # 알레르기 묶음 말과 재료 (실제 재료 사전 이름. 계란은 사전에서 달걀로 합쳐져 있다)
    allergy-groups:
      groups:
        - word: 견과류
          ingredients: 호두, 아몬드, 잣, 캐슈넛, 피스타치오, 마카다미아, 땅콩
        - word: 갑각류
          ingredients: 새우, 게, 꽃게, 게살, 게맛살, 가재새우
        - word: 유제품
          ingredients: 우유, 치즈, 버터, 생크림, 요거트
        - word: 달걀
          ingredients: 달걀, 메추리알, 마요네즈
        - word: 계란
          ingredients: 달걀, 메추리알, 마요네즈
        - word: 밀가루
          ingredients: 밀가루, 부침가루, 튀김가루, 빵가루
    # 음식 말 (공백 빼고 비교). AI가 상관없는 질문(OFF_TOPIC)이라고 해도 이 말이 있으면 거절하지 않는다
    # 분류 단어(묶음 말 포함)·재료 사전 이름·레시피 이름도 같이 본다. 달라는 말(ask-words.request)이 있으면 추천, 없으면 일반 답
    food-words:
      food: 먹, 요리, 레시피, 밥, 반찬, 끼니, 아침, 점심, 저녁, 야식, 간식, 재료, 냉장고, 장보기, 밀키트
    # 메시지로 밀키트를 보여 줄지 정한다 (공백 빼고 비교, 부정어는 taste-words와 같다)
    mealkit-words:
      # 밀키트를 직접 말하면 밀키트만 최대 3장 ("밀키트 추천해줘")
      mealkit: 밀키트
      # 요리를 번거로워하면 레시피 카드 3장 아래 밀키트 한 장 ("간단하게 먹을 거")
      easy: 간단, 간편, 빨리, 귀찮, 요리하기싫
  llm:
    # 공식 가격 확인 필요 (USD / 1M tokens)
    input-per-1m: 0.15
    output-per-1m: 0.60
  review-summary:
    cron: ${REVIEW_SUMMARY_CRON:0 0 4 * * *}
    enabled: ${REVIEW_SUMMARY_ENABLED:true}
  search:
    # 상단 통합 검색 엔진. mysql(기존 LIKE) | elasticsearch
    engine: ${SEARCH_ENGINE:elasticsearch}
    index-properties:
      recipe:
        alias: recipes
        index-settings: classpath:elasticsearch/recipes/recipes_index.json
        synonyms: classpath:elasticsearch/recipes/ingredient_synonyms.json
        extra-synonyms: classpath:elasticsearch/recipes/synonyms.txt
        batch-size: 500
        # 색인할 때 레시피 임베딩을 넣을지. 벡터 검색(vector.enabled)이 쓸 벡터를 여기서 넣는다
        # embedding 필드가 없는 예전 인덱스(strict)에서는 단건 색인이 실패하므로, 켤 때 인덱스를 지우고 재시작해 재색인한다
        embedding-enabled: ${RECIPE_EMBEDDING_ENABLED:true}
      product:
        alias: products
        index-settings: classpath:elasticsearch/products/products_index.json
        # 레시피와 같은 동의어를 써서 같은 검색어에 레시피·상품이 함께 걸리게 한다
        synonyms: classpath:elasticsearch/recipes/ingredient_synonyms.json
        extra-synonyms: classpath:elasticsearch/recipes/synonyms.txt
        batch-size: 500
      # 냉장고 재료명 정제용. 별칭 사전은 뒤에 있는 파일이 같은 별칭을 덮어쓴다
      ingredient:
        alias: ingredients
        index-settings: classpath:elasticsearch/ingredients/ingredients_index.json
        alias-dictionaries:
          - classpath:elasticsearch/recipes/ingredient_synonyms.json
          - classpath:elasticsearch/ingredients/ingredient_aliases.json
        batch-size: 500
        # 색인할 때 재료 임베딩을 넣는다 (후보 제안 등 나중 기능용)
        embedding-enabled: ${INGREDIENT_EMBEDDING_ENABLED:true}
    # 키워드 검색 결과가 0건일 때만 쓰는 벡터 검색. 임베딩을 넣어 재색인한 뒤 켠다
    vector:
      enabled: ${SEARCH_VECTOR_ENABLED:true}
      dimensions: 1536
      # 근거: docs/testing/recipe-vector-fallback-evaluation.md. 0.5 아래는 오답이 빠르게 늘고, 11위부터는 대부분 오답이다
      k: 10
      num-candidates: 100
      min-similarity: 0.5
      batch-size: 100
    # 벡터 폴백의 검색어 임베딩. 같은 검색어는 캐시를 쓰고, 캐시에 없을 때만 1분 호출 수를 센다 (서비스 전체 기준)
    query-embedding:
      cache-ttl: ${SEARCH_QUERY_EMBEDDING_CACHE_TTL:1d}
      limit-per-minute: ${SEARCH_QUERY_EMBEDDING_LIMIT_PER_MINUTE:60}
    
# 결제
portone:
  base-url: "https://api.portone.io"
  # CI 때문에 반드시 아래 값들이 존재해야만 기동됩니다
  # 간단한 테스트용 빈 값으로 채운다
  api-secret: ${PORTONE_API_SECRET:}
  store-id: ${PORTONE_STORE_ID:}
  # 결제대행사별 채널 키. 결제창에서 쓰는 공개 값이라 테스트 채널 키를 기본값으로 둔다
  channels:
    kakaopay: ${PORTONE_CHANNEL_KAKAOPAY:channel-key-c2b525f3-ef4b-475f-868f-8728605ff965}
    kicc: ${PORTONE_CHANNEL_KICC:channel-key-876081a3-3d8b-4813-858a-044c4e5adf26}
    inicis: ${PORTONE_CHANNEL_INICIS:channel-key-d302b8e8-dec4-488d-83eb-8b8f8b325b21}
    tosspayments: ${PORTONE_CHANNEL_TOSSPAYMENTS:channel-key-b82ea224-4515-4a6f-9465-0a13d9c79213}
    tosspay: ${PORTONE_CHANNEL_TOSSPAY:channel-key-9b866d23-24cb-47cf-8530-f712f8ddddc6}
  # 토스페이먼츠 정기결제(빌링) 테스트 채널. 카드 등록(빌링키 발급)과 등록 카드 결제에 쓴다
  billing-channel-key: ${PORTONE_CHANNEL_BILLING:channel-key-8cbf22a0-1ed2-445e-b639-e613828f3ed1}
  # WebhookVerifier가 기동 시 whsec_ 뒤를 base64로 풀기 때문에 형식만 맞춘 임의 값("local-dummy-webhook-secret")
  webhook-secret: ${PORTONE_WEBHOOK_SECRET:whsec_bG9jYWwtZHVtbXktd2ViaG9vay1zZWNyZXQ=}

springdoc:
  writer-with-order-by-keys: true

# 주간 판매 예측 워커(forecast_model). 로컬은 루트 docker-compose가 8091 포트를 연다.
forecast:
  worker-url: ${FORECAST_WORKER_URL:http://localhost:8091}

# AI 상담 단어 설정: 맛·분류·묻는 말·음식 말·밀키트 단어 (application.yml의 spring.config.import로 불러온다)
app:
  chat:
    # 서로 반대인 맛. 다시 추천에서 이번 말에 원한 맛과 반대인 맛은 원하는 맛에서 지운다 (단맛·감칠맛은 반대 없음, 반대가 아닌 맛은 쌓는다)
    taste-opposites:
      pairs:
        - [MILD, SPICY]
        - [MILD, SALTY]
    # 메시지의 맛 단어로 AI가 뽑은 원하는 맛·피할 맛을 한 번 더 확인한다 (공백 빼고 비교)
    taste-words:
      spicy: 매운, 맵게, 맵지, 매콤, 얼큰, 칼칼
      sweet: 달달, 달게, 단거, 단걸, 단것, 달콤, 단맛
      # 맛 단어 바로 앞에 오면 피함 ("안 맵게", "덜 달게")
      negation-before: 안, 덜
      # 맛 단어 뒤 4글자 안에서 시작하면 피함 ("매운 거 말고", "맵지 않게", "단 거 싫어", "매운 거 못 먹어", "매운 건 빼 줘", "매운 거 제외하고", "매운 게 안 들어간")
      # 분류 단어(CategoryWordChecker)·밀키트 단어(MealkitWordChecker)도 이 목록을 같이 쓴다 ("디저트 빼줘", "밀키트 말고")
      negation-after: 말고, 빼고, 않, 싫, 없이, 못먹, 빼줘, 빼주, 빼달, 제외, 안들어간, 없는
      # 새 추천에서 이번 말에 그 맛을 말했는지만 본다 (말하지 않은 맛은 원하는·피할 맛에서 뺀다)
      salty: 짠, 짭짤, 짜게, 짭조름
      umami: 감칠, 고소
      mild: 순한, 담백, 슴슴, 심심, 자극적이지
      # 맛 단어에 붙으면 그 맛을 확실히 원함 ("좀 더 매운", "매운 걸로", "매운 거 먹고 싶어"). 원하는 말 앞에 안·덜이 끼면 아니다
      # 부정어도 이 말도 없으면 애매하므로 AI가 피할 맛으로 둔 맛을 원하는 맛으로 바꾸지 않는다 ("매운 건 별로야")
      want-before: 더
      want-after: 걸로, 거로, 것으로, 먹고싶, 땡, 좋아, 원해, 당겨
      # 맛 조건을 지우라는 말. 이 말 없이 피하는 맛만 말했으면("매운 건 빼줘") AI가 넣은 뺄 조건 TASTE를 지워 직전에 원한 다른 맛을 남긴다
      clear: 맛상관없, 맛은상관없, 맛아무거나, 맛은아무거나
    # 분류 이름과 다른 흔한 말을 분류 묶음으로 본다 (추천·다시 추천의 분류 단어 보정). 분류는 실제 레시피 분류 이름만
    # "국수"는 묶음 말이 아니다 (국으로 보지 않는다)
    category-words:
      groups:
        - word: 국물
          categories: 국, 찌개, 전골, 수프, 스튜
        # 수프의 다른 표기 ("맵고 따뜻한 스프")
        - word: 스프
          categories: 수프
        - word: 면
          categories: 면류
        - word: 반찬
          categories: 무침, 조림, 볶음, 김치, 절임
        - word: 후식
          categories: 디저트
        - word: 간식
          categories: 디저트, 과자, 빵, 떡
        - word: 안주
          categories: 구이, 전, 튀김
        - word: 술안주
          categories: 구이, 전, 튀김
        # "한끼"만으로는 보지 않는다 ("다이어트 한 끼"는 샐러드)
        - word: 간단한한끼
          categories: 밥, 면류, 볶음
        - word: 간단하게한끼
          categories: 밥, 면류, 볶음
    # 서버가 AI 의도를 추천으로 바꿀 때 본다: 달라는 말이 있고 묻는 말이 없을 때만 바꾼다 (공백 빼고 비교)
    ask-words:
      # "추천 기준이 뭐야?"처럼 달라는 말과 같이 있으면 묻는 말이 이긴다
      # 지난 일을 묻는 말("밥 먹었어?")도 묻는 말이다
      # 먹어도 되는지 묻는 말("유통기한 지난 거 먹어도 돼?")도 묻는 말이다 (냉장고 보기로 바꾸지 않는다)
      # 영양을 묻는 말("브로콜리 영양소 알려줘")도 묻는 말이다 (재료 이름만 보고 추천으로 바꾸지 않는다)
      question: 기준, 어떻게, 왜, 방법, 얼마나, 보관, 가격, 차이, 뭐가달라, 뭐가다른, 먹었어, 먹었니, 먹었냐, 했어, 했니, 먹어도돼, 괜찮, 영양소, 영양성분, 효능
      request: 추천, 뭐있, 보여줘, 먹고싶, 사고싶, 골라줘
      # "밀키트"와 같이 있을 때만 달라는 말로 본다 ("국물 밀키트 있어?")
      mealkit-request: 있어, 있나, 있을까, 없어, 뭐가좋아, 살만한
      # 인사 말이 있으면 이름만 말한 짧은 말이어도 추천으로 바꾸지 않는다 ("안녕 밥은?")
      greeting: 안녕, 반가워, 반갑, 고마워, 고맙, 감사, 잘지내, 잘자, 좋은아침
    # 음식 말 (공백 빼고 비교). AI가 상관없는 질문(OFF_TOPIC)이라고 해도 이 말이 있으면 거절하지 않는다
    # 분류 단어(묶음 말 포함)·재료 사전 이름·레시피 이름도 같이 본다. 달라는 말(ask-words.request)이 있으면 추천, 없으면 일반 답
    food-words:
      food: 먹, 요리, 레시피, 밥, 반찬, 끼니, 아침, 점심, 저녁, 야식, 간식, 재료, 냉장고, 장보기, 밀키트
    # AI가 추천·일반 대화로 봐도 이 말이 있으면 서버가 냉장고 보기·사기로 바꾼다 (공백 빼고 비교, 둘 다 있으면 냉장고 보기)
    # 요리 말(cook)이 같이 있거나 묻는 말(ask-words.question)이 있으면 바꾸지 않는다
    fridge-shop-words:
      # 냉장고 보기 말 ("밀키트 뭐 남았어", "두부 아직 있어?", "냉장고에 뭐 있어", "내 냉장고에서 밀키트 어떤 거 있어?", "곧 버려야 할 거 있어?")
      # "슬슬 처리해야 할 거 있어?"도 냉장고 보기다. "처리해야"만으로는 보지 않는다 ("고기 핏물 처리해야 돼?")
      fridge: 남았, 아직있, 냉장고에뭐, 냉장고에있, 냉장고에서, 버려야, 유통기한지난, 소비기한지난, 처리해야할거, 처리할거
      # 냉장고 보기 범위를 소비기한 임박·지남으로 보는 말
      # AI가 범위를 ALL로 뒀을 때만 보충한다 ("오래된 거 뭐 있어?"처럼 단어 밖 표현은 AI가 잡는다)
      imminent: 버려야, 지난, 임박, 유통기한, 소비기한, 상한, 상할, 상했, 오래된, 오래됐, 처리해야
      # 냉장고 보기 범위를 기본 양념으로 보는 말 ("내 냉장고에 기본 양념 뭐 있어?"). 찾을 재료 이름으로 보지 않는다. "양념"만으로는 보지 않는다 ("양념치킨 밀키트")
      seasoning: 기본양념, 조미료
      # 사기 말 ("당근 사고 싶어", "두부 어디서 사", "대파 장바구니에 담아줘"). "주문"만으로는 보지 않는다 ("주문한 거 언제 와?")
      shop: 사고싶, 어디서사, 장바구니, 담아, 주문해
      # 할인 말. 사기로 보고 할인 중인 상품만 보여 준다 ("세일하는 재료 있어?", "할인하는 밀키트 뭐 있어?")
      sale: 세일, 할인, 특가, 번개
      # 요리 말. 같이 있으면 추천 그대로 ("냉장고에 있는 재료로 뭐 먹지"). "먹" 한 글자는 넣지 않는다 ("냉장고에 먹을 거 뭐 남았어"는 냉장고 보기)
      cook: 추천, 만들, 해먹, 요리, 레시피, 뭐먹, 먹지, 먹을까
      # 묻는 말. AI가 냉장고 보기·사기로 봤어도 이 말이 있으면 일반 답 ("유통기한 지난 거 먹어도 돼?", "주문한 거 언제 와?")
      # "얼마나"·"가격"은 넣지 않는다 ("두부 얼마나 남았어?", "두부 가격 얼마야?"는 냉장고 보기·사기)
      # 짜 달라는 말("장보기 목록 짜줘")도 일반 답이다
      general: 어떻게, 방법, 보관, 해동, 먹어도돼, 괜찮, 왜, 언제와, 언제도착, 배송, 짜줘, 짜줄
    # 메시지로 밀키트를 보여 줄지 정한다 (공백 빼고 비교, 부정어는 taste-words와 같다)
    mealkit-words:
      # 밀키트를 직접 말하면 밀키트만 최대 3장 ("밀키트 추천해줘")
      mealkit: 밀키트
      # 요리를 번거로워하면 레시피 카드 3장 아래 밀키트 한 장 ("간단하게 먹을 거")
      easy: 간단, 간편, 빨리, 귀찮, 요리하기싫

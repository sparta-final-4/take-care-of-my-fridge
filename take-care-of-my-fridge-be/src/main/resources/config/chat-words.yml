# AI 상담 단어 설정: 맛·묻는 말·밀키트·냉장고 보기·온도 단어 (application.yml의 spring.config.import로 불러온다)
# 의도를 단어로 고치던 단계와 그 단계만 쓰던 단어(분류 묶음 말·음식 말·달라는 말 등)는 Jev 전환 정리에서 지웠다
app:
  chat:
    words:
      # 서로 반대인 맛. 다시 추천에서 이번 말에 원한 맛과 반대인 맛은 원하는 맛에서 지운다 (단맛·감칠맛은 반대 없음, 반대가 아닌 맛은 쌓는다)
      taste-opposites:
        pairs:
          - [MILD, SPICY]
          - [MILD, SALTY]
      # 온도 말 (TemperatureWordChecker). 추천에서 메시지·원한 표현에 따뜻한 말만 있으면 찬 요리를 빼고,
      # 차가운 말만 있으면 뜨거운 국물 요리를 뒤로 보낸다 (둘 다 있거나 둘 다 없으면 보지 않는다). 공백 빼고 비교
      temperature:
        warm: 따뜻, 따듯, 뜨끈, 뜨뜻, 따끈, 뜨거운, 뜨겁
        cold: 차가운, 차갑, 시원, 찬거, 찬걸, 찬음식
        # 이름에 들어 있으면 찬 요리. "냉" 한 글자는 쓰지 않는다 ("냉이된장찌개"가 빠지지 않게)
        cold-dishes: 냉국, 냉채, 냉면, 냉스프, 냉수프, 냉파스타, 냉우동, 냉소바, 냉메밀, 냉모밀, 냉라면, 냉짬뽕, 콩국수, 빙수, 화채, 차가운, 아이스
        # 이름이 이 말로 끝나면 뜨거운 국물 요리 ("꽃게해물탕", "김치찌개"). "탕수육"은 끝이 아니라 걸리지 않는다
        hot-dish-endings: 탕, 전골, 찌개, 국밥
        # 뜨거운 국물 끝말로 끝나도 국물 요리가 아닌 이름
        hot-dish-exclusions: 그라탕, 냉탕
      # 메시지의 맛 단어로 AI가 뽑은 원하는 맛·피할 맛을 한 번 더 확인한다 (공백 빼고 비교)
      taste:
        spicy: 매운, 맵게, 맵지, 매콤, 얼큰, 칼칼
        sweet: 달달, 달게, 단거, 단걸, 단것, 달콤, 단맛
        # 맛 단어 바로 앞에 오면 피함 ("안 맵게", "덜 달게")
        negation-before: 안, 덜
        # 맛 단어 뒤 4글자 안에서 시작하면 피함 ("매운 거 말고", "맵지 않게", "단 거 싫어", "매운 거 못 먹어", "매운 건 빼 줘", "매운 거 제외하고", "매운 게 안 들어간")
        # 밀키트 단어(MealkitWordChecker)도 이 목록을 같이 쓴다 ("밀키트 말고")
        negation-after: 말고, 빼고, 않, 싫, 없이, 못먹, 빼줘, 빼주, 빼달, 제외, 안들어간, 없는
        # 새 추천에서 이번 말에 그 맛을 말했는지만 본다 (말하지 않은 맛은 원하는·피할 맛에서 뺀다)
        salty: 짠, 짭짤, 짜게, 짭조름
        umami: 감칠, 고소
        mild: 순한, 담백, 슴슴, 심심, 자극적이지
        # 맛 단어에 붙으면 그 맛을 확실히 원함 ("좀 더 매운", "매운 걸로", "매운 거 먹고 싶어"). 원하는 말 앞에 안·덜이 끼면 아니다
        # 부정어도 이 말도 없으면 애매하므로 AI가 피할 맛으로 둔 맛을 원하는 맛으로 바꾸지 않는다 ("매운 건 별로야")
        want-before: 더
        want-after: 걸로, 거로, 것으로, 먹고싶, 땡, 좋아, 원해, 당겨
        # 맛 조건을 지우라는 말. 이 말 없이 피하는 맛만 말했으면("매운 건 빼줘") AI가 넣은 뺄 조건 TASTE를 지워 직전에 원한 다른 맛을 남긴다
        clear: 맛상관없, 맛은상관없, 맛아무거나, 맛은아무거나
      # 묻는 말 (공백 빼고 비교). OpenAI 의도 판단이 실패했을 때 선택 재료가 있어도 묻는 말이면 추천으로 바꾸지 않는다
      ask:
        # 지난 일을 묻는 말("밥 먹었어?"), 먹어도 되는지·영양·요리가 무엇인지 묻는 말도 묻는 말이다
        question: 기준, 어떻게, 왜, 방법, 얼마나, 보관, 가격, 차이, 뭐가달라, 뭐가다른, 먹었어, 먹었니, 먹었냐, 했어, 했니, 먹어도돼, 괜찮, 영양소, 영양성분, 효능, 뭐야, 뭐예요, 뭐에요, 뭔데
      # 냉장고 보기·사기에서 볼 것 (공백 빼고 비교). 의도(냉장고 보기·사기)는 Jev·OpenAI가 정한다
      fridge-shop:
        # 냉장고 보기 범위를 소비기한 임박·지남으로 보는 말. AI가 범위를 ALL로 뒀을 때만 보충한다
        imminent: 버려야, 지난, 임박, 유통기한, 소비기한, 상한, 상할, 상했, 오래된, 오래됐, 처리해야
        # 냉장고 보기 범위를 기본 양념으로 보는 말 ("내 냉장고에 기본 양념 뭐 있어?"). 찾을 재료 이름으로 보지 않는다. "양념"만으로는 보지 않는다 ("양념치킨 밀키트")
        seasoning: 기본양념, 조미료
        # 할인 말. 사기에서 할인 중인 상품만 보여 준다 ("세일하는 재료 있어?", "할인하는 밀키트 뭐 있어?")
        sale: 세일, 할인, 특가, 번개
      # 메시지로 밀키트를 보여 줄지 정한다 (공백 빼고 비교, 부정어는 taste와 같다)
      mealkit:
        # 밀키트를 직접 말하면 밀키트만 최대 3장 ("밀키트 추천해줘")
        mealkit: 밀키트
        # 요리를 번거로워하면 레시피 카드 3장 아래 밀키트 한 장 ("간단하게 먹을 거")
        easy: 간단, 간편, 빨리, 귀찮, 요리하기싫

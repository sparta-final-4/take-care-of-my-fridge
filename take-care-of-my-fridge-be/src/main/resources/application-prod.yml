# 배포 서버(dev·main) 공통. imhungry-infra compose가 SPRING_PROFILES_ACTIVE=prod, APP_ENV=<dev|main> 으로 띄운다.
# - DB·Redis 접속 정보와 시크릿(JWT_SECRET 등)은 모두 Parameter Store /imhungry/<APP_ENV>/ 에서 직접 읽는다.
#   compose는 접속 정보를 넘기지 않는다. 키가 하나라도 없으면 기동에 실패한다.
#   EC2 역할에 이 경로 읽기 권한이 있고, 컨테이너도 인스턴스 메타데이터로 역할 자격 증명을 쓴다.
# APP_ENV는 기본값을 두지 않는다. 빠지면 다른 환경의 시크릿을 읽는 대신 기동에 실패한다.

# 앞단 Caddy(HTTPS)가 붙여 주는 X-Forwarded-* 를 읽어 원래 요청이 https임을 알게 한다(Swagger 서버 주소 등).
# native(Tomcat)는 내부 IP 대역 프록시가 보낸 X-Forwarded-* 만 믿고, Caddy가 걸러 주지 않는 Forwarded 헤더는 무시한다.
server:
  forward-headers-strategy: native

spring:
  config:
    import: "aws-parameterstore:/imhungry/${APP_ENV}/"
  jpa:
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  datasource:
    url: jdbc:mysql://${MYSQL_HOST}:${MYSQL_PORT}/${MYSQL_DATABASE}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}

  elasticsearch:
    uris: ${ELASTICSEARCH_URL}
    username: elastic
    password: ${ELASTIC_PASSWORD}

app:
  auth:
    # application.yml 값과 무관하게 반드시 Parameter Store 값을 쓴다(없으면 기동 실패).
    jwt-secret: ${JWT_SECRET}
    cookie-secure: true
  # imhungry-infra 가 /imhungry/<APP_ENV>/IMAGE_* 로 넣는다(없으면 기동 실패).
  image:
    bucket: ${IMAGE_BUCKET}
    key-prefix: ${IMAGE_KEY_PREFIX}
    public-base-url: ${IMAGE_PUBLIC_BASE_URL}
  # 배포 서버는 실제 AI로 답한다. 장애 때 CHAT_REPLY_GENERATOR=stub으로 가짜 답변기로 돌릴 수 있다
  chat:
    reply-generator: ${CHAT_REPLY_GENERATOR:openai}
  # Swagger UI·OpenAPI 문서를 켤 배포 환경. 여기에 없는 APP_ENV(main 등)는 꺼진다.
  swagger-enabled:
    dev: true

# dev·main이 같은 prod 프로파일을 쓰므로 APP_ENV로 구분한다. main(운영)에서는 API 구조를 외부에 공개하지 않는다.
springdoc:
  api-docs:
    enabled: ${app.swagger-enabled.${APP_ENV}:false}
  swagger-ui:
    enabled: ${app.swagger-enabled.${APP_ENV}:false}

# 배포 compose에서는 같은 네트워크의 forecast-worker 컨테이너로 붙는다(기존 코드 기본값과 같다).
forecast:
  worker-url: ${FORECAST_WORKER_URL:http://forecast-worker:8091}
    
portone:
  api-secret: ${PORTONE_API_SECRET}
  store-id: ${PORTONE_STORE_ID}
  webhook-secret: ${PORTONE_WEBHOOK_SECRET}